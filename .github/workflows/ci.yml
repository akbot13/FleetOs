# Checks every push and pull request. Needs no secrets and never connects to a database: the
# rate-card SQL runs in an in-memory Postgres (PGlite).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit && npx tsc -p tsconfig.node.json --noEmit
      - name: Unit tests
        run: npm test
      - name: Rate-card SQL tests
        run: npm run test:sql
      - name: Build
        run: npm run build
